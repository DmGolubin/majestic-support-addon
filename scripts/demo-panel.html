<!doctype html><html lang="ru"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Демо: подключение SupportTemplates</title><style>body{background:#0b0d10;color:#e6e8ea;font:15px/1.6 'Segoe UI',sans-serif;margin:0}main{max-width:620px;margin:60px auto;padding:24px;border:1px solid #272d35;border-radius:8px;background:#13161b}h1{font-size:24px}button,textarea{font:inherit;color:inherit;border:1px solid #333b45;border-radius:6px;padding:10px;background:#1b2027}button{cursor:pointer;margin:6px 8px 6px 0}button:first-of-type{background:#c51751}textarea{display:block;box-sizing:border-box;width:100%;min-height:180px}code{font-size:25px}p{color:#aab2bd}.note{border-left:3px solid #c51751;padding:12px;background:#22151d}a{color:#ee7ba2}</style><main><p class="note">ДЕМОРЕЖИМ · локальный сервер. Реального входа на panel.majestic-rp.tech здесь нет.</p><h1>Подключение SupportTemplates</h1><div id="view"></div><p id="status" role="status"></p></main><script>
const [id,key]=location.hash.slice(1).split('.');history.replaceState(null,'',location.pathname);let state;
const view=document.getElementById('view'),status=document.getElementById('status');
async function api(action,body){const r=await fetch('/sessions/'+encodeURIComponent(id)+'/'+action,{method:body?'POST':'GET',headers:{Authorization:'Bearer '+key,'Content-Type':'application/json'},body:body?JSON.stringify(body):undefined});if(!r.ok)throw Error('Действие недоступно ('+r.status+'). Откройте новую ссылку из плагина.');return r.json()}
function esc(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function load(){try{state=await api('state');if(state.phase==='pending')view.innerHTML='<p>Тестовый саппорт · Majestic и Россия Онлайн</p><code>'+esc(state.code)+'</code><p>Сверьте код с плагином. Разрешается чтение FAQ и работа с тестовой личной библиотекой.</p><button data-a="approve">Разрешить</button><button data-a="deny">Отказать</button><details><summary>Проверка ошибок</summary><button data-a="expire">Сделать код просроченным</button><button data-a="unavailable">Ошибка сервера на 20 секунд</button></details>';else if(state.phase==='ready')view.innerHTML='<h2>Подключено</h2><p>Вернитесь в Discord: библиотека появится автоматически.</p><h3>Действия старшего на тестовом сайте</h3><p>Версия FAQ: '+state.revision+'. Изменение поступит плагину при следующей проверке (до 2 секунд).</p><textarea id="text" aria-label="Текст тестового FAQ">'+esc(state.text)+'</textarea><button data-a="publish">Сохранить FAQ</button><button data-a="revoke">Отозвать устройство</button><details><summary>Проверка ошибок</summary><button data-a="unavailable">Ошибка сервера на 20 секунд</button></details>';else view.textContent='Подключение завершено: '+({denied:'отказ',revoked:'устройство отозвано',expired:'код истёк'}[state.phase]||state.phase);}catch(e){status.textContent=e.message}}
view.addEventListener('click',async e=>{const action=e.target.dataset.a;if(!action)return;e.target.disabled=true;try{await api(action,action==='publish'?{text:document.getElementById('text').value}:{});status.textContent=action==='publish'?'FAQ сохранён. Проверьте обновление в Discord.':'Готово';await load()}catch(err){status.textContent=err.message;e.target.disabled=false}});
if(id&&key)load();else view.textContent='Откройте «Подключение» в настройках плагина, включите деморежим и нажмите «Начать вход».';
</script></html>
